server:
  port: 8080

spring:
  application:
    name: exchange-rate-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exchangedb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:exchange}
    password: ${DB_PASSWORD:exchange}
  jpa:
    hibernate:
      # Flyway (db/migration) now owns schema creation for every profile;
      # Hibernate only cross-checks its entity mappings against what Flyway
      # created, so a real entity/migration mismatch fails fast at startup
      # instead of surfacing later as a runtime SQL error.
      ddl-auto: validate
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
    # Spring AI's own default (10 attempts, 2s initial backoff, x5 multiplier,
    # capped at 180s) can take several minutes to finally give up on a genuine
    # outage (verified empirically against an unreachable Ollama during T035) —
    # nowhere near the "clear, distinct error state" contracts/insight.md and
    # constitution Principle X call for on a synchronous request/response
    # endpoint. One short retry is enough to ride out a truly transient blip
    # without making a real outage look like a hang.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 2s

fixer:
  api-key: ${FIXER_API_KEY}
  base-url: ${FIXER_BASE_URL:http://data.fixer.io/api}

# Appendix B's spread lookup table (CurrencySpread/CurrencySpreadProperties) —
# externalized here so re-tiering or adding a currency is a config edit, not a
# code change. Values are quoted as YAML strings ("2.75", not bare 2.75) as a
# defensive habit for anything feeding a BigDecimal, even though this was
# checked empirically (CurrencySpreadPropertiesBindingTest, plus a manual
# unquoted trial while building this): this Spring Boot version's YAML
# property-source loader preserves the original scalar text either way, so
# quoting isn't compensating for an actual reproduced bug here — it's just
# removing any dependency on that implementation detail continuing to hold.
currency:
  spread:
    default-spread: "2.75"
    tiers:
      EUR: "0.00" # base currency (Fixer.io free tier is fixed to EUR)
      JPY: "3.25"
      HKD: "3.25"
      KRW: "3.25"
      MYR: "4.50"
      INR: "4.50"
      MXN: "4.50"
      RUB: "6.00"
      CNY: "6.00"
      ZAR: "6.00"

# The Angular dev server's origin, allowed to call /api/** via CORS (CorsConfig).
frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:4200}
