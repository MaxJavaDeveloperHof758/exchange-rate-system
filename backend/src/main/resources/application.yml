server:
  port: 8080

spring:
  application:
    name: exchange-rate-system
  datasource:
    url: jdbc:h2:file:./data/exchangedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}

fixer:
  api-key: ${FIXER_API_KEY}
  base-url: ${FIXER_BASE_URL:http://data.fixer.io/api}
