server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's client-side router owns every path - fall back to
    # index.html for anything nginx doesn't have a real file for, so a
    # hard refresh on e.g. /trend doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
